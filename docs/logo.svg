<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#e8e2d2"/>
    </radialGradient>
  </defs>
  <!-- Outer comic frame with drop shadow -->
  <rect x="10" y="10" width="112" height="112" rx="28" fill="#1a1a1a"/>
  <rect x="6" y="6" width="112" height="112" rx="28" fill="url(#bg)" stroke="#1a1a1a" stroke-width="6"/>
  <!-- Golden burst rays -->
  <g stroke="#f2b705" stroke-width="4" stroke-linecap="round">
    <line x1="62" y1="16" x2="62" y2="23"/>
    <line x1="94" y1="24" x2="88" y2="30"/>
    <line x1="30" y1="24" x2="36" y2="30"/>
    <line x1="104" y1="52" x2="96" y2="54"/>
  </g>
  <!-- Ground horizon line -->
  <path d="M 16 98 Q 62 92 108 98" fill="none" stroke="#cfc8b6" stroke-width="4" stroke-linecap="round"/>
  <!-- Two-pass dynamic stick character (Pass 1: Ink outline) -->
  <g fill="none" stroke="#1a1a1a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 56 56 L 52 78"/>
    <path d="M 56 60 L 34 46"/>
    <path d="M 56 60 L 82 44"/>
    <path d="M 52 78 L 38 100"/>
    <path d="M 52 78 L 72 98"/>
  </g>
  <!-- Pass 2: Inner blue fill -->
  <g fill="none" stroke="#2b7de9" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 56 56 L 52 78"/>
    <path d="M 56 60 L 34 46"/>
    <path d="M 56 60 L 82 44"/>
    <path d="M 52 78 L 38 100"/>
    <path d="M 52 78 L 72 98"/>
  </g>
  <!-- Character head -->
  <circle cx="58" cy="40" r="14" fill="#2b7de9" stroke="#1a1a1a" stroke-width="5.5"/>
  <path d="M 50 33 A 9 9 0 0 1 61 30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <ellipse cx="62" cy="39" rx="2.3" ry="3.2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <circle cx="62.6" cy="39" r="1.1" fill="#1a1a1a"/>
  <!-- Gold coin in raised right hand -->
  <circle cx="88" cy="40" r="11" fill="#f2b705" stroke="#1a1a1a" stroke-width="4"/>
  <text x="88" y="44" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="13" fill="#1a1a1a">★</text>
</svg>
